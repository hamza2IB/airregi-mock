<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RetailOS — Demo Portals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { dark: '#0a1535', DEFAULT: '#1a2d6b', light: '#2a4494' },
            brand: { blue: '#3366cc', green: '#2dd36f', orange: '#ff9800', red: '#eb445a', purple: '#7c4dff' },
            page: '#f4f6f9',
            border: '#e8ecf1'
          },
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="m-0 font-sans bg-page flex items-center justify-center min-h-screen">
  <div class="w-full max-w-[480px] mx-auto px-4">
    <div class="bg-white rounded-2xl p-8 shadow-sm">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-navy-dark rounded-xl flex items-center justify-center mx-auto mb-3">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <h1 class="text-[20px] font-extrabold text-navy-dark m-0" style="letter-spacing:-.4px;">RetailOS</h1>
        <p class="text-[11px] text-gray-400 tracking-wider mt-1 uppercase">Demo Portals</p>
      </div>
      <p class="text-center text-[13px] text-gray-500 mb-5">Select a portal to explore the demo</p>

      <!-- Admin Portal -->
      <a href="admin.html"
        class="block bg-gradient-to-r from-navy-dark to-navy rounded-2xl p-4 text-center border-2 border-transparent hover:border-brand-green transition-all no-underline">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-white/10 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
          </div>
          <div class="text-left flex-1 min-w-0">
            <div class="text-[13px] font-semibold text-white">Admin Portal</div>
            <div class="text-[11px] text-white/50">Platform dashboard, billing & oversight</div>
          </div>
          <svg class="w-4 h-4 text-white/40 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </div>
      </a>

    </div>
    <p class="text-center text-[11px] text-gray-300 py-4">RetailOS Demo — more portals coming soon</p>
  </div>
</body>

</html>
